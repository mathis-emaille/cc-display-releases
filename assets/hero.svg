<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Le widget CC Display flotte sur le bureau et se range dans la barre des tâches">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0d12"/>
      <stop offset="1" stop-color="#1b1b27"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>

  <style>
    text { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
    .blob-1 { animation: drift1 18s ease-in-out infinite alternate; }
    .blob-2 { animation: drift2 22s ease-in-out infinite alternate; }
    .blob-3 { animation: drift3 20s ease-in-out infinite alternate; }
    @keyframes drift1 { to { transform: translate(180px, 70px) scale(1.2); } }
    @keyframes drift2 { to { transform: translate(-200px, -50px) scale(.9); } }
    @keyframes drift3 { to { transform: translate(-120px, -90px) scale(1.25); } }

    .glide { animation: glide 18s cubic-bezier(.65,0,.35,1) infinite; }
    @keyframes glide {
      0%, 22%   { transform: translate(560px, 70px); }
      33%, 55%  { transform: translate(340px, 250px); }
      66%, 88%  { transform: translate(560px, 250px); }
      100%      { transform: translate(560px, 70px); }
    }
    .float { animation: float 5s ease-in-out infinite alternate; }
    @keyframes float { to { transform: translateY(-7px); } }


    .dot { animation: dot 6s steps(1) infinite; fill: #3a3a42; }
    .dot-2 { animation-delay: -2s; } .dot-3 { animation-delay: -4s; }
    @keyframes dot { 0% { fill: #6366f1; } 33.3% { fill: #3a3a42; } }

    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 50% { transform: scale(1.5); opacity: .45; } }
    .tick { animation: tick 6s ease-in-out infinite; }
    @keyframes tick { 0%,100% { opacity: .35; } 50% { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="960" height="540" fill="url(#bg)"/>

  <!-- drifting light -->
  <g filter="url(#blur)" opacity=".55">
    <circle class="blob-1" cx="180" cy="130" r="150" fill="#6366f1"/>
    <circle class="blob-2" cx="760" cy="330" r="140" fill="#cc785c"/>
    <circle class="blob-3" cx="560" cy="120" r="110" fill="#10a37f"/>
  </g>

  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity=".035">
    <path d="M0 90H960M0 180H960M0 270H960M0 360H960M0 450H960"/>
    <path d="M120 0V540M240 0V540M360 0V540M480 0V540M600 0V540M720 0V540M840 0V540"/>
  </g>

  <!-- OpenAI card, parked on the left -->
  <g transform="translate(70 96)" class="float" opacity=".92" filter="url(#shadow)">
    <rect width="270" height="132" rx="14" fill="#202024" stroke="#37373c"/>
    <rect x="16" y="16" width="30" height="30" rx="8" fill="#10a37f"/>
    <g transform="translate(31 31)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round">
      <path d="M0 -7 L6 -3.5 V3.5 L0 7 L-6 3.5 V-3.5 Z"/><path d="M0 -7 V0 L6 3.5 M0 0 L-6 3.5"/>
    </g>
    <text x="56" y="28" fill="#ebebf0" font-size="14" font-weight="600">OpenAI</text>
    <text x="56" y="44" fill="#9696a0" font-size="11">compte@exemple.com</text>
    <text x="16" y="76" fill="#9696a0" font-size="10.5">5 heures</text>
    <text x="254" y="76" fill="#ebebf0" font-size="10.5" text-anchor="end">42 %</text>
    <rect x="16" y="82" width="238" height="8" rx="4" fill="#373740"/>
    <rect x="16" y="82" width="35.7" height="8" rx="4.0" fill="#22c55e"><animate attributeName="width" dur="20s" repeatCount="indefinite" values="35.7;130.9;35.7" keyTimes="0;0.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/></rect>
    <text x="16" y="110" fill="#9696a0" font-size="10.5">7 jours</text>
    <text x="254" y="110" fill="#ebebf0" font-size="10.5" text-anchor="end">18 %</text>
    <rect x="16" y="116" width="238" height="6" rx="3" fill="#373740"/>
    <rect x="16" y="116" width="43" height="6" rx="3" fill="#22c55e"/>
  </g>

  <!-- Anthropic card gliding around the desktop -->
  <g class="glide">
    <g class="float" filter="url(#shadow)">
      <rect width="300" height="150" rx="14" fill="#202024" stroke="#37373c"/>
      <rect x="16" y="16" width="32" height="32" rx="8" fill="#cc785c"/>
      <g transform="translate(32 32)" stroke="#fff" stroke-width="1.7" stroke-linecap="round">
        <path d="M0 -8V8M-8 0H8M-5.6 -5.6L5.6 5.6M-5.6 5.6L5.6 -5.6"/>
      </g>
      <text x="58" y="30" fill="#ebebf0" font-size="14.5" font-weight="600">Anthropic</text>
      <circle class="pulse" cx="234" cy="26" r="3.5" fill="#22c55e"/>
      <text x="244" y="30" fill="#9696a0" font-size="10.5">en direct</text>
      <text x="58" y="46" fill="#9696a0" font-size="11">vous@exemple.com</text>

      <text x="16" y="82" fill="#9696a0" font-size="11">5 heures</text>
      <text x="284" y="82" fill="#ebebf0" font-size="11" text-anchor="end">en cours</text>
      <rect x="16" y="90" width="268" height="10" rx="5" fill="#373740"/>
    <rect x="16" y="90" width="53.6" height="10" rx="5.0" fill="#22c55e"><animate attributeName="width" dur="18s" repeatCount="indefinite" values="53.6;241.2;53.6" keyTimes="0;0.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/><animate attributeName="fill" dur="18s" repeatCount="indefinite" values="#22c55e;#eab308;#ef4444;#eab308;#22c55e" keyTimes="0;.3;.5;.7;1"/></rect>

      <text x="16" y="120" fill="#9696a0" font-size="11">7 jours</text>
      <rect x="16" y="128" width="268" height="10" rx="5" fill="#373740"/>
    <rect x="16" y="128" width="93.8" height="10" rx="5.0" fill="#22c55e"><animate attributeName="width" dur="24s" repeatCount="indefinite" values="93.8;227.8;93.8" keyTimes="0;0.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/><animate attributeName="fill" dur="24s" repeatCount="indefinite" values="#22c55e;#eab308;#ef4444;#eab308;#22c55e" keyTimes="0;.3;.5;.7;1"/></rect>

    </g>
  </g>

  <!-- rotation dots, under the OpenAI card -->
  <g transform="translate(205 246)">
    <circle class="dot" cx="-12" cy="0" r="3"/><circle class="dot dot-2" cx="0" cy="0" r="3"/><circle class="dot dot-3" cx="12" cy="0" r="3"/>
  </g>
  <text x="205" y="268" fill="#9696a0" font-size="10.5" text-anchor="middle" class="tick">plusieurs comptes, un seul widget</text>

  <!-- Windows 11 style taskbar -->
  <g>
    <rect x="0" y="486" width="960" height="54" fill="#16161c" fill-opacity=".92"/>
    <line x1="0" y1="486.5" x2="960" y2="486.5" stroke="#ffffff" stroke-opacity=".08"/>
    <g fill="#2c2c34">
      <rect x="326" y="498" width="30" height="30" rx="8"/><rect x="364" y="498" width="30" height="30" rx="8"/>
      <rect x="402" y="498" width="30" height="30" rx="8"/><rect x="440" y="498" width="30" height="30" rx="8"/>
    </g>
    <g fill="#6366f1" opacity=".9"><rect x="328" y="500" width="12" height="12" rx="2"/><rect x="342" y="500" width="12" height="12" rx="2"/><rect x="328" y="514" width="12" height="12" rx="2"/><rect x="342" y="514" width="12" height="12" rx="2"/></g>

    <!-- the widget, docked in the taskbar -->
    <g transform="translate(496 497)">
      <rect width="236" height="32" rx="9" fill="#202024" stroke="#37373c"/>
      <rect x="6" y="5" width="22" height="22" rx="6" fill="#cc785c"/>
      <g transform="translate(17 16)" stroke="#fff" stroke-width="1.4" stroke-linecap="round"><path d="M0 -6V6M-6 0H6M-4.2 -4.2L4.2 4.2M-4.2 4.2L4.2 -4.2"/></g>
      <rect x="38" y="9" width="80" height="6" rx="3" fill="#373740"/>
    <rect x="38" y="9" width="16.0" height="6" rx="3.0" fill="#22c55e"><animate attributeName="width" dur="18s" repeatCount="indefinite" values="16.0;72.0;16.0" keyTimes="0;0.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/><animate attributeName="fill" dur="18s" repeatCount="indefinite" values="#22c55e;#eab308;#ef4444;#eab308;#22c55e" keyTimes="0;.3;.5;.7;1"/></rect>
      <rect x="38" y="19" width="80" height="6" rx="3" fill="#373740"/>
    <rect x="38" y="19" width="28.0" height="6" rx="3.0" fill="#22c55e"><animate attributeName="width" dur="24s" repeatCount="indefinite" values="28.0;68.0;28.0" keyTimes="0;0.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/><animate attributeName="fill" dur="24s" repeatCount="indefinite" values="#22c55e;#eab308;#ef4444;#eab308;#22c55e" keyTimes="0;.3;.5;.7;1"/></rect>
      <rect x="130" y="5" width="1" height="22" fill="#37373c"/>
      <rect x="140" y="5" width="22" height="22" rx="6" fill="#10a37f"/>
      <g transform="translate(151 16)" fill="none" stroke="#fff" stroke-width="1.3" stroke-linejoin="round"><path d="M0 -6 L5 -3 V3 L0 6 L-5 3 V-3 Z"/></g>
      <rect x="170" y="9" width="56" height="6" rx="3" fill="#373740"/>
      <rect x="170" y="9" width="24" height="6" rx="3" fill="#22c55e"/>
      <rect x="170" y="19" width="56" height="6" rx="3" fill="#373740"/>
      <rect x="170" y="19" width="10" height="6" rx="3" fill="#22c55e"/>
    </g>

    <!-- tray + clock -->
    <g fill="#9696a0"><circle cx="816" cy="513" r="3"/><circle cx="830" cy="513" r="3"/><circle cx="844" cy="513" r="3"/></g>
    <text x="930" y="508" fill="#ebebf0" font-size="11" text-anchor="end">14:32</text>
    <text x="930" y="523" fill="#9696a0" font-size="10" text-anchor="end">23/10/2026</text>
  </g>
</svg>
